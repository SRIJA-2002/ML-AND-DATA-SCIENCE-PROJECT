<!DOCTYPE html>
<html>
<head>
    <title>Cyber Shield</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0f172a; color: white; font-family: Arial; 
            height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        h1 { color: #4ade80; font-size: 38px; font-weight: 900; letter-spacing: 1px; }
        .sub { color: #94a3b8; font-size: 16px; margin-bottom: 15px; }
        
        .result-box {
            padding: 14px 20px; font-weight: 900; font-size: 22px; text-align: center;
            border-radius: 12px; width: 520px; margin-bottom: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }
        .safe { background: #22c55e; color: white; }
        .attack { background: #f97316; color: white; }

        .form-box { 
            background: #1e293b; padding: 22px 28px; 
            border-radius: 16px; width: 520px;
            border: 1px solid #334155;
        }
        label { font-weight: 700; font-size: 15px; display: block; margin-top: 14px; color: #cbd5e1; }
        input { 
            width: 100%; padding: 12px 14px; margin-top: 5px; 
            border-radius: 10px; border: 2px solid #334155; 
            font-size: 16px; font-weight: 600;
            background: white; color: black;
        }
        input:focus { border-color: #4ade80; outline: none; }
        button {
            width: 100%; padding: 14px; margin-top: 12px; 
            font-weight: 900; font-size: 17px; letter-spacing: 1px;
            border: none; border-radius: 12px; cursor: pointer;
        }
        .btn-scan { background: #eaff8f; color: #1a2e05; }
        .btn-scan:hover { background: #d9f06a; }
        .btn-clear { background: #334155; color: #e2e8f0; border: 1px solid #475569; }
        .btn-clear:hover { background: #475569; }
        .btn-row { display: flex; gap: 10px; margin-top: 20px; }
        .btn-row button { margin-top: 0; }
    </style>
</head>
<body>

    <h1>🛡️ CYBER SHIELD</h1>
    <p class="sub">Smart AI Security Guard</p>

    {% if result %}
    <div class="result-box {{ cls }}" id="resultBox">{{ result }}</div>
    {% endif %}

    <div class="form-box">
        <form method="POST" action="/" id="idsForm">
            <label>Duration</label>
            <input type="number" name="f1" id="f1" value="{{ request.form.f1 }}" required>
            <label>Protocol Type (0,1,2)</label>
            <input type="number" name="f2" id="f2" value="{{ request.form.f2 }}" required>
            <label>Service (0-70)</label>
            <input type="number" name="f3" id="f3" value="{{ request.form.f3 }}" required>
            <label>Src Bytes</label>
            <input type="number" name="f4" id="f4" value="{{ request.form.f4 }}" required>
            <label>Dst Bytes</label>
            <input type="number" name="f5" id="f5" value="{{ request.form.f5 }}" required>
            
            <div class="btn-row">
                <button type="submit" class="btn-scan">🔍 SCAN FOR ATTACK</button>
                <button type="button" class="btn-clear" onclick="clearData()">🗑️ CLEAR</button>
            </div>
        </form>
    </div>

<script>
function clearData() {
    document.querySelectorAll('input').forEach(input => {
        input.value = '';
    });
    let resultBox = document.getElementById('resultBox');
    if(resultBox) {
        resultBox.style.display = 'none';
    }
}
</script>

</body>
</html>
